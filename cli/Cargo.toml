[package]
name = "api-scenario-patch"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Record redacted, reviewable API scenarios as deterministic Markdown and YAML"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-api-scenario-patch"
readme = "../README.md"
keywords = ["api", "cli", "proxy", "git", "redaction"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "asp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "0.9"
url = "2.5"

[dev-dependencies]
tempfile = "3.20"
